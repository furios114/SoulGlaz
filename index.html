<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SoulGlaz</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            ◉ SOUL<span>GLAZ</span>
        </div>

        <div class="status">
            <span class="dot"></span>
            LIVE
        </div>

        <div id="objectCount">
            OBJECTS: 0
        </div>

    </header>


    <aside class="panel">

        <h2>SOULGLAZ RADAR</h2>

        <div class="category">
            <span>✈ AIRCRAFT</span>
            <strong id="aircraftCount">0</strong>
        </div>

        <div class="category">
            <span>🚁 ROTORCRAFT</span>
            <strong id="helicopterCount">0</strong>
        </div>

        <div class="category">
            <span>🚢 VESSELS</span>
            <strong>—</strong>
        </div>

        <div class="category">
            <span>📷 VISION</span>
            <strong>OFFLINE</strong>
        </div>

        <div class="info">

            <div>DATA SOURCE</div>

            <strong>
                OPENSKY NETWORK
            </strong>

        </div>

    </aside>


    <main id="map"></main>


    <div class="coordinates">

        SOULGLAZ<br>

        <span id="mapPosition">
            GLOBAL MAP
        </span>

    </div>


    <div class="legend">

        <span>
            <i class="air"></i>
            AIR
        </span>

        <span>
            <i class="you"></i>
            YOU
        </span>

    </div>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="app.js"></script>

</body>

</html>

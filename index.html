<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOULGLAZ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">SOULGLAZ</div>

    <div class="status">
      <span class="status-dot"></span>
      LIVE
    </div>
  </header>

  <main>

    <section class="radar-section">
      <div class="section-title">RADAR</div>

      <div id="map"></div>

      <div class="radar-info">
        <span>OBJECTS: <b id="objectCount">0</b></span>
        <span>LAT: <b id="lat">0.000000</b></span>
        <span>LON: <b id="lon">0.000000</b></span>
      </div>
    </section>


    <section class="vision-section">

      <div class="section-title">
        VISION
        <span id="visionStatus">OFFLINE</span>
      </div>

      <div class="camera-container">

        <video
          id="camera"
          autoplay
          playsinline
          muted
        ></video>

        <canvas id="visionCanvas"></canvas>

        <div id="cameraMessage">
          CAMERA OFFLINE
        </div>

      </div>

      <div class="vision-controls">

        <button id="startCamera">
          START CAMERA
        </button>

        <button id="switchCamera">
          SWITCH CAMERA
        </button>

      </div>

      <div class="vision-stats">

        <div>
          <span>PEOPLE</span>
          <b id="peopleCount">0</b>
        </div>

        <div>
          <span>OBJECTS</span>
          <b id="detectedCount">0</b>
        </div>

      </div>

      <div class="detections">
        <div class="detection-title">
          DETECTED
        </div>

        <div id="detectionList">
          Nothing detected
        </div>
      </div>

    </section>

  </main>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- TensorFlow -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

  <!-- COCO-SSD object detection model -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <script src="app.js"></script>

</body>
</html>

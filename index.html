<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SoulGlaz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            ◉ SOUL<span>GLAZ</span>
        </div>

        <div class="status">
            <span class="dot"></span>
            LIVE
        </div>
    </header>

    <main class="radar">

        <div class="radar-ring ring-1"></div>
        <div class="radar-ring ring-2"></div>
        <div class="radar-ring ring-3"></div>

        <div class="cross horizontal"></div>
        <div class="cross vertical"></div>

        <div class="radar-sweep"></div>

        <div class="object plane plane-1">✈</div>
        <div class="object plane plane-2">✈</div>
        <div class="object helicopter">🚁</div>
        <div class="object ship">▲</div>

        <div class="center">
            ●
        </div>

    </main>

    <aside class="panel">

        <h2>SOULGLAZ</h2>

        <div class="category">
            <div>✈ AIRCRAFT</div>
            <strong>1,248</strong>
        </div>

        <div class="category">
            <div>🚁 HELICOPTERS</div>
            <strong>183</strong>
        </div>

        <div class="category">
            <div>🚢 VESSELS</div>
            <strong>4,821</strong>
        </div>

        <button class="camera-button">
            ◉ OPEN CAMERA
        </button>

    </aside>

    <script src="app.js"></script>

</body>
</html>
